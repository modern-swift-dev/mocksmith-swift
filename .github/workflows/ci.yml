name: CI

on:
  pull_request:
  workflow_dispatch:

defaults:
  run:
    shell: bash

jobs:
  lint:
    runs-on: macos-26
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - name: Verify Swift 6.3
        run: swift --version | grep -F 'Swift version 6.3'
      - name: Install lint tools
        run: |
          brew install mint actionlint
          mint bootstrap
      - name: Lint
        run: make lint
      - name: Verify bundled generator matches its source
        run: Scripts/build-generator-artifact.sh --check
      - name: Test bundled generator caching
        run: python3 Scripts/test-generator.py Tools/MocksmithGenerator.artifactbundle/bin/MocksmithGenerator
      - name: Test Xcode build-description caching
        run: python3 Scripts/test-xcode-build-cache.py

  linux:
    runs-on: ubuntu-24.04
    container: swift:6.3
    steps:
      - uses: actions/checkout@v4
      - name: Verify Swift 6.3
        run: swift --version | grep -F 'Swift version 6.3'
      - name: Install Mint and xcbeautify
        run: |
          git clone --depth 1 --branch 0.18.0 https://github.com/yonaskolb/Mint.git "$RUNNER_TEMP/Mint"
          swift build --package-path "$RUNNER_TEMP/Mint" -c release
          mint_bin="$(swift build --package-path "$RUNNER_TEMP/Mint" -c release --show-bin-path)"
          echo "$mint_bin" >> "$GITHUB_PATH"
          "$mint_bin/mint" install cpisciotta/xcbeautify
      - name: Build
        run: swift build 2>&1 | mint run --no-install cpisciotta/xcbeautify -q
      - name: Test
        run: swift test 2>&1 | mint run --no-install cpisciotta/xcbeautify -q

  apple:
    runs-on: macos-26
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macOS
            destination: platform=macOS
          - platform: iOS
            destination: simulator
            device_type: com.apple.CoreSimulator.SimDeviceType.iPhone-17-Pro
            runtime: com.apple.CoreSimulator.SimRuntime.iOS-26-5
          - platform: tvOS
            destination: simulator
            device_type: com.apple.CoreSimulator.SimDeviceType.Apple-TV-4K-3rd-generation-4K
            runtime: com.apple.CoreSimulator.SimRuntime.tvOS-26-5
          - platform: watchOS
            destination: simulator
            device_type: com.apple.CoreSimulator.SimDeviceType.Apple-Watch-Series-11-46mm
            runtime: com.apple.CoreSimulator.SimRuntime.watchOS-26-5
    steps:
      - uses: actions/checkout@v4
      - name: Install xcbeautify
        run: |
          brew install mint
          mint install cpisciotta/xcbeautify
      - name: Verify Xcode 26.6 and Swift 6.3
        run: |
          xcodebuild -version | grep -F 'Xcode 26.6' 2>&1 | mint run --no-install cpisciotta/xcbeautify -q
          swift --version | grep -F 'Swift version 6.3'
      - name: Select test destination
        id: destination
        env:
          DESTINATION: ${{ matrix.destination }}
          DEVICE_TYPE: ${{ matrix.device_type }}
          RUNTIME: ${{ matrix.runtime }}
        run: |
          if [[ "$DESTINATION" != "simulator" ]]; then
            echo "value=$DESTINATION" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          simulator_id="$(
            xcrun simctl list devices available --json |
              jq -r \
                --arg runtime "$RUNTIME" \
                --arg device_type "$DEVICE_TYPE" \
                '.devices[$runtime] // [] | map(select(.deviceTypeIdentifier == $device_type)) | first | .udid // empty'
          )"

          if [[ -z "$simulator_id" ]]; then
            simulator_id="$(xcrun simctl create 'Mocksmith CI' "$DEVICE_TYPE" "$RUNTIME")"
          fi

          echo "value=id=$simulator_id" >> "$GITHUB_OUTPUT"
      - name: Build for ${{ matrix.platform }}
        run: xcodebuild build -scheme Mocksmith-Package -destination '${{ steps.destination.outputs.value }}' 2>&1 | mint run --no-install cpisciotta/xcbeautify -q
      - name: Test on ${{ matrix.platform }}
        run: xcodebuild test -scheme Mocksmith-Package -destination '${{ steps.destination.outputs.value }}' 2>&1 | mint run --no-install cpisciotta/xcbeautify -q
