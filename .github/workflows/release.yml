name: Release

on:
  push:
    tags:
      - '*'

permissions:
  contents: write

jobs:
  release:
    runs-on: blacksmith-6vcpu-macos-26
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.4.1.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4

      - name: Validate release tag
        id: tag
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          if [[ ! "$tag" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Release tags must be stable semantic versions (MAJOR.MINOR.PATCH): $tag" >&2
            exit 1
          fi
          echo "version=$tag" >> "$GITHUB_OUTPUT"

      - name: Verify Swift 6.3
        run: |
          swift --version
          swift --version | grep -F 'Swift version 6.3'

      - name: Build documentation bundle
        run: make docs-release VERSION='${{ steps.tag.outputs.version }}'

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.version }}
        run: |
          gh release create "$TAG" "build/Mocksmith-Documentation-$TAG.zip" \
            --verify-tag \
            --title "Mocksmith $TAG" \
            --generate-notes
